[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloudbox-spike"
version = "0.1.0"
description = "Run a short-lived Pi agent in an AWS Lambda MicroVM."
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.86",
    "pyjwt[crypto]==2.13.0",
]

[project.scripts]
cloudbox = "cloudbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cloudbox"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Catch errors, sort imports, and use current Python syntax before commits.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
